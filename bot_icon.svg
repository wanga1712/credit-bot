<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Фон -->
  <rect width="512" height="512" fill="#4A90E2" rx="80"/>
  
  <!-- Калькулятор -->
  <rect x="100" y="120" width="312" height="272" rx="20" fill="#FFFFFF" stroke="#2E5C8A" stroke-width="8"/>
  
  <!-- Экран калькулятора -->
  <rect x="130" y="150" width="252" height="60" rx="10" fill="#2E5C8A"/>
  <text x="256" y="195" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">₽</text>
  
  <!-- Кнопки калькулятора -->
  <circle cx="180" cy="280" r="25" fill="#4A90E2"/>
  <circle cx="256" cy="280" r="25" fill="#4A90E2"/>
  <circle cx="332" cy="280" r="25" fill="#4A90E2"/>
  <circle cx="180" cy="330" r="25" fill="#4A90E2"/>
  <circle cx="256" cy="330" r="25" fill="#4A90E2"/>
  <circle cx="332" cy="330" r="25" fill="#4A90E2"/>
  
  <!-- График (внизу) -->
